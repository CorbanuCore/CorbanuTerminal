# sync-ci-mode: sync branch only; scripts/upstream_sync/ci_mode.py adds and removes this file (S0 -> S4).
# Package-scoped clippy and tests while the workspace still has conflict markers (upstreamSyncPlan.md section 4).
# Trigger: push the commit to test to a branch named sync-ci/<anything>. A workflow_dispatch workflow cannot be
# used: GitHub only dispatches workflows whose file also exists on the default branch.
# Packages and platforms come from .github/sync-package-ci.json at that commit, for example
#   {"packages": ["codex-core"], "platforms": ["linux", "macos", "windows"], "test": true}
name: sync-package-ci

on:
  push:
    branches: ["sync-ci/**"]

permissions:
  contents: read

concurrency:
  group: sync-package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
      test: ${{ steps.plan.outputs.test }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: plan
        shell: python
        run: |
          import json, os, re
          cfg = json.load(open(".github/sync-package-ci.json"))
          pkgs = cfg["packages"]
          assert pkgs and all(re.fullmatch(r"[A-Za-z0-9_-]+", p) for p in pkgs), pkgs
          legs = {
              "linux": {"runner": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu"},
              "macos": {"runner": "macos-15", "target": "aarch64-apple-darwin"},
              "windows": {"runner": "windows-2022", "target": "x86_64-pc-windows-msvc"},
          }
          include = [legs[p] for p in cfg.get("platforms", ["linux", "macos", "windows"])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': include})}\n")
              out.write(f"packages={' '.join('-p ' + p for p in pkgs)}\n")
              out.write(f"test={'true' if cfg.get('test', True) else 'false'}\n")

  package:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608"
      PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      # Like main's core-security and full-suite lanes: opt in here, not in setup-ci,
      # so other Linux lanes keep Ubuntu 24.04's default AppArmor restriction.
      - name: Enable unprivileged user namespaces (Linux)
        if: ${{ runner.os == 'Linux' }}
        working-directory: .
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Configure rusty_v8 artifacts when the action exists
        id: v8
        working-directory: .
        run: |
          if [ -f .github/actions/setup-rusty-v8/action.yml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ steps.v8.outputs.present == 'true' }}
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: cargo clippy (packages, --tests, -D warnings)
        if: false
        run: cargo clippy --locked --target "${{ matrix.target }}" $PACKAGES --all-targets -- -D warnings
      # sync-integrator scratch branch (copied from sync-winapp #2277): helper binaries the tests start.
      - name: Build helper binaries
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra=(-p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner --bin codex-conpty-launcher)
          fi
          cargo build --locked --target "${{ matrix.target }}" "${extra[@]}" \
            -p codex-cli --bin codex \
            -p codex-code-mode-host --bin codex-code-mode-host \
            -p codex-exec --bin codex-exec \
            -p codex-rmcp-client --bin test_stdio_server --bin test_streamable_http_server
      # ds-lane scratch (D709): stress three macOS app-server one-off failures (#2814 / sync-integrator).
      - name: stress three app-server tests
        run: |
          T1=suite::v2::analytics::multi_agent_v2_tools_emit_collaborator_analytics
          T2=suite::v2::guardian_v2::sync_sessions::managed_reviewers_reuse_fork_and_resume_after_parent_shutdown
          T3=suite::v2::app_installed::installed_apps_failed_force_refresh_retains_previous_snapshot
          cargo test --locked --target "${{ matrix.target }}" -p codex-app-server --test all --no-run
          fails=0
          for i in $(seq 1 40); do
            if ! cargo test --locked --target "${{ matrix.target }}" -p codex-app-server --test all -- "$T1" "$T2" "$T3" > "iso-$i.log" 2>&1; then
              fails=$((fails+1)); echo "::warning::isolated iteration $i failed"; grep -E "^test .* FAILED|panicked at|^---- " "iso-$i.log" | head -20
            fi
          done
          echo "isolated failures: $fails/40"
          for i in 1 2 3; do
            if ! cargo test --locked --target "${{ matrix.target }}" -p codex-app-server --test all --no-fail-fast > "full-$i.log" 2>&1; then
              echo "::warning::full run $i had failures"; grep -E "^test .* FAILED|^test result" "full-$i.log" | head -30
            fi
            grep -E "^test ($T1|$T2|$T3).* (ok|FAILED)" "full-$i.log" | sort | uniq -c
          done
