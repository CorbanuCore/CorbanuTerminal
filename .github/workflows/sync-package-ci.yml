# sync-ci-mode: sync branch only; scripts/upstream_sync/ci_mode.py adds and removes this file (S0 -> S4).
# Package-scoped clippy and tests while the workspace still has conflict markers (upstreamSyncPlan.md section 4).
# Trigger: push the commit to test to a branch named sync-ci/<anything>. A workflow_dispatch workflow cannot be
# used: GitHub only dispatches workflows whose file also exists on the default branch.
# Packages and platforms come from .github/sync-package-ci.json at that commit, for example
#   {"packages": ["codex-core"], "platforms": ["linux", "macos", "windows"], "test": true}
# "test": true builds the helper binaries the tests start and runs nextest with codex-rs/.config/nextest.toml,
# like the other test lanes (per-test timeouts; one process per test). Clippy runs by default only when
# "test" is false; set "clippy": true to run both (#2814).
name: sync-package-ci

on:
  push:
    branches: ["sync-ci/**"]

permissions:
  contents: read

concurrency:
  group: sync-package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
      test: ${{ steps.plan.outputs.test }}
      clippy: ${{ steps.plan.outputs.clippy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: plan
        shell: python
        run: |
          import json, os, re
          cfg = json.load(open(".github/sync-package-ci.json"))
          pkgs = cfg["packages"]
          assert pkgs and all(re.fullmatch(r"[A-Za-z0-9_-]+", p) for p in pkgs), pkgs
          legs = {
              "linux": {"runner": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu"},
              "macos": {"runner": "macos-15", "target": "aarch64-apple-darwin"},
              "windows": {"runner": "windows-2022", "target": "x86_64-pc-windows-msvc"},
          }
          include = [legs[p] for p in cfg.get("platforms", ["linux", "macos", "windows"])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': include})}\n")
              out.write(f"packages={' '.join('-p ' + p for p in pkgs)}\n")
              test = bool(cfg.get("test", True))
              out.write(f"test={'true' if test else 'false'}\n")
              out.write(f"clippy={'true' if cfg.get('clippy', not test) else 'false'}\n")

  package:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608"
      PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      # Like main's core-security and full-suite lanes: opt in here, not in setup-ci,
      # so other Linux lanes keep Ubuntu 24.04's default AppArmor restriction.
      - name: Enable unprivileged user namespaces (Linux)
        if: ${{ runner.os == 'Linux' }}
        working-directory: .
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Configure rusty_v8 artifacts when the action exists
        id: v8
        working-directory: .
        run: |
          if [ -f .github/actions/setup-rusty-v8/action.yml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ steps.v8.outputs.present == 'true' }}
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: cargo clippy (packages, --tests, -D warnings)
        if: ${{ needs.plan.outputs.clippy == 'true' }}
        # PACKAGES is validated by the plan job (names only) and intentionally word-split.
        run: cargo clippy --locked --target "${{ matrix.target }}" $PACKAGES --all-targets -- -D warnings
      # Helper binaries the tested packages' tests start, from the same map as
      # rust-ci-changed-crate-tests.yml (#2277, #2814); on Windows also the
      # sandbox helpers that codex-core and app-server tests launch.
      - name: Build helper binaries
        if: ${{ needs.plan.outputs.test == 'true' }}
        run: |
          read -r -a words <<< "$PACKAGES"
          names=()
          for word in "${words[@]}"; do
            if [ "$word" != "-p" ]; then names+=("$word"); fi
          done
          python=python3
          command -v python3 > /dev/null || python=python
          # Assign first so a failing lookup fails the step (set -e).
          helper_args="$("$python" ../.github/scripts/changed_crate_test_packages.py --helpers "${names[@]}")"
          read -r -a helpers <<< "$helper_args"
          if [ "$RUNNER_OS" = "Windows" ]; then
            for name in "${names[@]}"; do
              if [ "$name" = "codex-core" ] || [ "$name" = "codex-app-server" ]; then
                helpers+=(-p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner --bin codex-conpty-launcher)
                break
              fi
            done
          fi
          if (( ${#helpers[@]} == 0 )); then
            echo "No helpers needed."
            exit 0
          fi
          cargo build --locked --target "${{ matrix.target }}" "${helpers[@]}"
      - if: ${{ needs.plan.outputs.test == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.111
      - name: cargo nextest run (packages)
        if: ${{ needs.plan.outputs.test == 'true' }}
        # PACKAGES is word-split on purpose, as for clippy.
        run: cargo nextest run --locked --target "${{ matrix.target }}" $PACKAGES --no-fail-fast --final-status-level fail
      - name: Upload nextest JUnit report
        if: ${{ always() && needs.plan.outputs.test == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sync-package-ci-junit-${{ matrix.target }}
          path: codex-rs/target/nextest/default/junit.xml
          if-no-files-found: ignore
