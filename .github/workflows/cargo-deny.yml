name: cargo-deny

on:
  workflow_call:
  schedule:
    - cron: "23 8 * * *"

jobs:
  cargo-deny:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Merge current base into PR checkout
        id: merge-base
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/cargo_deny.py merge-base

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      # EmbarkStudios/cargo-deny-action is a Docker action whose image pulls
      # rust:1.85.0-alpine3.20 from Docker Hub anonymously, which hits the
      # unauthenticated pull rate limit on shared runners. Install the same
      # cargo-deny release it ships, checksum-verified, and run it directly.
      - name: Install cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: 0.19.0
          CARGO_DENY_SHA256: 0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}" --strip-components=1
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run cargo-deny
        # Only PR advisories already on the current base become warnings.
        # Main retains the full blocking check and its issue report.
        working-directory: .
        env:
          DENY_BASE_SHA: ${{ steps.merge-base.outputs.base }}
        run: |
          args=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "${DENY_BASE_SHA}"
            args+=(--base "${DENY_BASE_SHA}")
          fi
          python3 .github/scripts/cargo_deny.py check --output "${RUNNER_TEMP}/cargo-deny.jsonl" "${args[@]}"

      - name: Save main report
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-deny-report
          path: |
            ${{ runner.temp }}/cargo-deny.jsonl
            ${{ runner.temp }}/cargo-deny.status
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  report:
    name: Report main dependencies
    needs: cargo-deny
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: cargo-deny-main-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-deny-report
          path: ${{ runner.temp }}/cargo-deny-report

      - name: Update single dependency tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/cargo_deny.py report --output "${RUNNER_TEMP}/cargo-deny-report/cargo-deny.jsonl"
