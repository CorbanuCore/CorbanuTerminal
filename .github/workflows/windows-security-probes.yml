name: windows-security-probes

# win-377b: #1871 capability-SID file concurrency test (test branch, never merged).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: win-377b cap_sid concurrency (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Test
        shell: bash
        run: |
          set +e
          git log -1 --format='HEAD %H %s'
          for i in 1; do
            cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact cap::tests::update_lock_is_the_users_only 2>&1 | tail -25
            echo "attempt $i exit=${PIPESTATUS[0]}"
          done
