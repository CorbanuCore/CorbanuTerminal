name: windows-security-probes

# win-1819 (test branch, never merged): an elevated command started while a
# legacy command runs, in an elevated and a normal session, per target ref.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: JSON list of refs to measure
        default: '["win-1819-failbefore", "win-1819"]'

permissions:
  contents: read

jobs:
  probe:
    name: win-1819 ${{ matrix.ref }} (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.targets) }}
    env:
      T1819: unified_exec::tests::command_identity::elevated::sec_win_1819_elevated_command_starts_while_a_legacy_command_runs
      TSETUP: unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format='HEAD %H %s'
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run
      - name: Admin session
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CODEX_SEC_WIN_341_REQUIRE: "1"
        run: |
          set +e +o pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact "$T1819" --nocapture --test-threads=1 > admin.log 2>&1
          echo "exit=$?"
          cat admin.log
          { echo "REF ${{ matrix.ref }} $(git rev-parse HEAD) admin"; grep -E 'sec-win-1819|test result|panicked|timed out' admin.log; } >> results.txt
      - name: Normal session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $temp = Join-Path $env:RUNNER_TEMP 'medium-temp'
          New-Item -ItemType Directory $temp -ErrorAction Stop | Out-Null
          icacls $temp /setowner "*$user" /Q | Out-Null
          $full = [Security.AccessControl.FileSystemRights]::FullControl
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $dacl = New-Object Security.AccessControl.DirectorySecurity
          $dacl.SetAccessRuleProtection($true, $false)
          foreach ($s in @($user, 'S-1-5-18', 'S-1-5-32-544')) {
            $dacl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
              (New-Object Security.Principal.SecurityIdentifier($s)), $full, $inherit, 'None', 'Allow')))
          }
          [IO.Directory]::SetAccessControl($temp, $dacl)
          $env:TEMP = $temp
          $env:TMP = $temp
          $ErrorActionPreference = 'Continue'
          $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run --message-format=json
          $sandbox = ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'pf27s06-seed'
          New-Item -ItemType Directory -Force $env:CODEX_PF27S06_SETUP_SEED | Out-Null
          & $sandbox --exact $env:TSETUP --nocapture --test-threads=1 | Out-Null
          "record setup exit=$LASTEXITCODE"
          $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
          $out = & $medium -Program $sandbox -TimeoutMinutes 20 -Arguments @('--exact', $env:T1819, '--nocapture', '--test-threads=1')
          "exit=$LASTEXITCODE"
          $out
          $out | Out-File -Encoding utf8 normal.log
          Add-Content -Encoding ascii results.txt "REF $env:GITHUB_REF_NAME normal"
          $out | Where-Object { $_ -match 'sec-win-1819|test result|panicked|timed out' } | ForEach-Object { Add-Content -Encoding ascii results.txt $_ }
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat results.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: w1819-${{ matrix.ref }}
          path: |
            results.txt
            admin.log
            normal.log
