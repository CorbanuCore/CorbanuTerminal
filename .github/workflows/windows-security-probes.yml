name: windows-security-probes

# win-d429: D429 gate measurement (probe branch, never merged): the fix
# branch and main plus the same tests (fail-before).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: JSON list of branches to measure
        default: '["win-d429-probe","win-d429-failbefore"]'

permissions:
  contents: read

jobs:
  probe:
    name: win-d429 ${{ matrix.ref }} (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.targets) }}
    env:
      D429_TESTS: >-
        token::tests::d429_legacy_default_dacl_gives_shared_sids_only_synchronize
        unified_exec::tests::command_identity::elevated::d429::sec_win_d429_elevated_command_cannot_read_a_legacy_command
        unified_exec::tests::command_identity::elevated::d429::sec_win_d429_legacy_command_cannot_read_another_legacy_command
        unified_exec::tests::command_identity::elevated::d429::sec_win_d429_legacy_workloads_still_work
        unified_exec::tests::command_identity::legacy_command_cannot_write_to_another_commands_process
        unified_exec::tests::command_identity::legacy_command_keeps_write_access_to_its_own_processes
        unified_exec::tests::command_identity::legacy_command_tools_work_with_command_identity
        unified_exec::tests::command_identity::legacy_command_cannot_borrow_another_workspaces_command_token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format='HEAD %H %s'
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run
      - name: Admin session
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e +o pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          export CODEX_PF27S06_SETUP_SEED="$(cygpath -w "${RUNNER_TEMP}/d429-seed")"
          mkdir -p "${RUNNER_TEMP}/d429-seed"
          echo "REF ${{ matrix.ref }} $(git rev-parse HEAD)" >> results.txt
          for t in $D429_TESTS; do
            cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --include-ignored --exact "$t" --nocapture --test-threads=1 > one.log 2>&1
            code=$?
            cat one.log >> admin.log
            { echo "admin $t exit=$code"; grep -E '^d429 |^d259 |test result|panicked|missing=|left:|right:' one.log; } >> results.txt
          done
          cat results.txt
      - name: Normal session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $temp = Join-Path $env:RUNNER_TEMP 'medium-temp'
          New-Item -ItemType Directory $temp -ErrorAction Stop | Out-Null
          icacls $temp /setowner "*$user" /Q | Out-Null
          $full = [Security.AccessControl.FileSystemRights]::FullControl
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $dacl = New-Object Security.AccessControl.DirectorySecurity
          $dacl.SetAccessRuleProtection($true, $false)
          foreach ($s in @($user, 'S-1-5-18', 'S-1-5-32-544')) {
            $dacl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
              (New-Object Security.Principal.SecurityIdentifier($s)), $full, $inherit, 'None', 'Allow')))
          }
          [IO.Directory]::SetAccessControl($temp, $dacl)
          $env:TEMP = $temp
          $env:TMP = $temp
          $ErrorActionPreference = 'Continue'
          $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run --message-format=json
          $sandbox = ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'd429-seed'
          $whoami = & $medium -Program "$env:SystemRoot\System32\whoami.exe" -Arguments @('/groups')
          $whoami | Select-String 'Mandatory Level'
          foreach ($t in ($env:D429_TESTS -split ' ')) {
            & $sandbox --exact 'unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes' --nocapture --test-threads=1 | Out-Null
            $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
            $out = & $medium -Program $sandbox -TimeoutMinutes 20 -Arguments @('--include-ignored', '--exact', $t, '--nocapture', '--test-threads=1')
            $code = $LASTEXITCODE
            Remove-Item Env:CODEX_SEC_WIN_1648_REQUIRE
            $out | Add-Content -Encoding utf8 normal.log
            Add-Content -Encoding ascii results.txt "normal $t exit=$code"
            $out | Where-Object { $_ -match '^d429 |^d259 |test result|panicked|missing=|left:|right:' } | ForEach-Object { Add-Content -Encoding ascii results.txt $_ }
          }
          Get-Content results.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat results.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: d429-${{ matrix.ref }}
          path: |
            results.txt
            admin.log
            normal.log
