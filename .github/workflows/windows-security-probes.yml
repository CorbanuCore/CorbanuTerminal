name: windows-security-probes

# win-377: D377 gate (test branch, never merged): the two D377 tests in an
# elevated and a normal session.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: win-377 D377 gate (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format='HEAD %H %s'
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run
      - name: Unit tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e +o pipefail
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib session_temp:: -- --nocapture --test-threads=1 > unit.log 2>&1
          echo "exit=$?"; cat unit.log
          { echo "UNIT"; grep -E '^test |test result' unit.log; } >> results.txt
      - name: Admin session
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CODEX_SEC_WIN_341_REQUIRE: "1"
        run: |
          set +e +o pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          export CODEX_PF27S06_SETUP_SEED="$(cygpath -w "${RUNNER_TEMP}/d377-seed")"
          mkdir -p "${RUNNER_TEMP}/d377-seed"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib sec_win_d377_ -- --nocapture --test-threads=1 > admin.log 2>&1
          echo "exit=$?"; cat admin.log
          { echo "ADMIN $(git rev-parse HEAD)"; grep -E '^test |test result|panicked|d377 ' admin.log; } >> results.txt
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact unified_exec::tests::token_boundary::sec_win_1770_elevated_command_cannot_write_to_a_shared_folder unified_exec::tests::env_case::win_1805_elevated_command_gets_one_path_and_start_process_runs --nocapture --test-threads=1 > left.log 2>&1
          { echo "LEFTOVER-CHECK $(grep 'test result' left.log)"; echo "untracked under codex-rs: $(git status --porcelain --untracked-files=normal -- codex-rs | grep -c '^??')"; git status --porcelain --untracked-files=normal -- codex-rs; } >> results.txt
      - name: Normal session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $temp = Join-Path $env:RUNNER_TEMP 'medium-temp'
          New-Item -ItemType Directory $temp -ErrorAction Stop | Out-Null
          icacls $temp /setowner "*$user" /Q | Out-Null
          $full = [Security.AccessControl.FileSystemRights]::FullControl
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $dacl = New-Object Security.AccessControl.DirectorySecurity
          $dacl.SetAccessRuleProtection($true, $false)
          foreach ($s in @($user, 'S-1-5-18', 'S-1-5-32-544')) {
            $dacl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
              (New-Object Security.Principal.SecurityIdentifier($s)), $full, $inherit, 'None', 'Allow')))
          }
          [IO.Directory]::SetAccessControl($temp, $dacl)
          $env:TEMP = $temp
          $env:TMP = $temp
          $ErrorActionPreference = 'Continue'
          $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run --message-format=json
          $sandbox = ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'd377-seed'
          Add-Content -Encoding ascii results.txt 'NORMAL'
          foreach ($t in @('sec_win_d377_elevated_command_gets_its_own_temp_folder', 'sec_win_d377_old_temp_folder_grant_is_taken_back', 'sec_win_d377_command_cannot_turn_its_temp_folder_into_a_link')) {
            $t = "unified_exec::tests::command_identity::elevated::d377::$t"
            $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
            $out = & $medium -Program $sandbox -Arguments @('--exact', $t, '--nocapture', '--test-threads=1')
            Remove-Item Env:CODEX_SEC_WIN_1648_REQUIRE
            $out
            $out | Where-Object { $_ -match '^test |test result|panicked|d377 ' } | ForEach-Object { Add-Content -Encoding ascii results.txt $_ }
          }
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat results.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: d377-gate
          path: |
            results.txt
            unit.log
            admin.log
