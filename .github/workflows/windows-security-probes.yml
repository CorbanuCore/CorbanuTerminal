name: windows-security-probes

# win-1560m: D367/D368 compatibility probes only (test branch, never merged).
on:
  workflow_dispatch:

jobs:
  probes:
    name: win-1560m ${{ matrix.variant }} (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [base, d368, d367a, both]
    env:
      CORBANU_PROBE_VARIANT: ${{ matrix.variant }}
      CODEX_SEC_WIN_341_REQUIRE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build the sandbox helpers and tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run
          node --version; npm --version; python --version; pwsh --version; git --version; cargo --version
      - name: Admin session
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e +o pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          run() { cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- "$@"; }
          tests=$(run --list --format terse --include-ignored sec_win_1648_ command_identity::legacy_ probe_1560m_ | sed -n 's/: test$//p')
          for t in $tests; do
            run --exact "$t" --include-ignored --nocapture --test-threads=1 > t.log 2>&1
            code=$?
            cat t.log
            cat t.log >> all-admin.log
            if grep -q 'test result: ok. 1 passed' t.log; then r=pass; else r="FAIL($code)"; fi
            echo "TESTRESULT|$CORBANU_PROBE_VARIANT|admin|$t|$r" | tee -a results.txt
            grep -E 'W1560M\||d324 (race|borrow)|d259 borrow' t.log >> results.txt || true
          done
          # The rest of the existing P1 hardening suite, as main's CI runs it.
          run sec_win_ --nocapture --test-threads=1 > suite.log 2>&1
          tail -n 60 suite.log
          echo "SUITE|$CORBANU_PROBE_VARIANT|admin|sec_win_|$(grep -E '^test result' suite.log | tail -n1)" | tee -a results.txt
          grep -E 'test .* \.\.\. FAILED' suite.log | sed "s/^/SUITEFAIL|$CORBANU_PROBE_VARIANT|admin|/" >> results.txt || true
      - name: Normal session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run --message-format=json
          $sandbox = ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'w1560m-seed'
          New-Item -ItemType Directory -Force $env:CODEX_PF27S06_SETUP_SEED | Out-Null
          Remove-Item Env:CODEX_SEC_WIN_341_REQUIRE
          $tests = @(& $sandbox --list --format terse --include-ignored 'sec_win_1648_' 'command_identity::legacy_' 'probe_1560m_' | Where-Object { $_ -like '*: test' } | ForEach-Object { $_ -replace ': test$', '' })
          foreach ($t in $tests) {
            $elevatedBackend = ($t -like '*sec_win_1648_*') -or ($t -like '*probe_1560m_elevated_*')
            if ($elevatedBackend) {
              # Record a fresh setup elevated, then reuse it at medium integrity.
              & $sandbox --exact 'unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes' --nocapture --test-threads=1 | Out-Null
              $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
            }
            $out = & $medium -Program $sandbox -TimeoutMinutes 20 -Arguments @('--exact', $t, '--include-ignored', '--nocapture', '--test-threads=1')
            $out | Out-File -Append -Encoding utf8 all-normal.log
            $code = $LASTEXITCODE
            if ($elevatedBackend) { Remove-Item Env:CODEX_SEC_WIN_1648_REQUIRE }
            $out
            $r = if (($out -join "`n") -match 'test result: ok\. 1 passed') { 'pass' } else { "FAIL($code)" }
            $line = "TESTRESULT|$($env:CORBANU_PROBE_VARIANT)|normal|$t|$r"
            $line
            Add-Content -Encoding ascii results.txt $line
            $out | Where-Object { $_ -match 'W1560M\||d324 (race|borrow)|d259 borrow' } | ForEach-Object { Add-Content -Encoding ascii results.txt $_ }
          }
          $suite = & $medium -Program $sandbox -Arguments @('sec_win_', '--nocapture', '--test-threads=1')
          $suite | Select-Object -Last 60
          $joined = $suite -join "`n"
          $summary = [regex]::Matches($joined, 'test result: [^\r\n]*') | Select-Object -Last 1
          Add-Content -Encoding ascii results.txt "SUITE|$($env:CORBANU_PROBE_VARIANT)|normal|sec_win_|$summary"
          [regex]::Matches($joined, 'test \S+ \.\.\. FAILED') | ForEach-Object { Add-Content -Encoding ascii results.txt "SUITEFAIL|$($env:CORBANU_PROBE_VARIANT)|normal|$($_.Value)" }
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat results.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: w1560m-${{ matrix.variant }}
          path: |
            results.txt
            all-admin.log
            all-normal.log
            suite.log
