name: windows-security-probes

# win-1803l: #1803 cross-workspace read probe for the legacy (non-admin)
# backend and cross-backend pairs (test branch, never merged). Reuses win-1803m.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: JSON list of branches to measure
        default: '["win-1803l-probe"]'

permissions:
  contents: read

jobs:
  probe:
    name: win-1803l ${{ matrix.ref }} (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.targets) }}
    env:
      W1803M_TEST: unified_exec::tests::command_identity::elevated::probe_1803m::probe_1803l_cross_backend_read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format='HEAD %H %s'
          cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run
      - name: Admin session
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e +o pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          export CODEX_PF27S06_SETUP_SEED="$(cygpath -w "${RUNNER_TEMP}/w1803m-seed")"
          mkdir -p "${RUNNER_TEMP}/w1803m-seed"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact "$W1803M_TEST" --nocapture --test-threads=1 > admin.log 2>&1
          echo "exit=$?"
          cat admin.log
          { echo "REF ${{ matrix.ref }} $(git rev-parse HEAD)"; grep -E 'W1803M\||test result' admin.log; } >> results.txt
      - name: Normal session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          # #1752: a temp folder secured like a real user's.
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $temp = Join-Path $env:RUNNER_TEMP 'medium-temp'
          New-Item -ItemType Directory $temp -ErrorAction Stop | Out-Null
          icacls $temp /setowner "*$user" /Q | Out-Null
          $full = [Security.AccessControl.FileSystemRights]::FullControl
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $dacl = New-Object Security.AccessControl.DirectorySecurity
          $dacl.SetAccessRuleProtection($true, $false)
          foreach ($s in @($user, 'S-1-5-18', 'S-1-5-32-544')) {
            $dacl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
              (New-Object Security.Principal.SecurityIdentifier($s)), $full, $inherit, 'None', 'Allow')))
          }
          [IO.Directory]::SetAccessControl($temp, $dacl)
          $env:TEMP = $temp
          $env:TMP = $temp
          $ErrorActionPreference = 'Continue'
          $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run --message-format=json
          $sandbox = ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'w1803m-seed'
          $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
          $whoami = & $medium -Program "$env:SystemRoot\System32\whoami.exe" -Arguments @('/groups')
          $whoami | Select-String 'Mandatory Level'
          $out = & $medium -Program $sandbox -TimeoutMinutes 45 -Arguments @('--exact', $env:W1803M_TEST, '--nocapture', '--test-threads=1')
          $out
          $out | Out-File -Encoding utf8 normal.log
          $out | Where-Object { $_ -match 'W1803M\||test result' } | ForEach-Object { Add-Content -Encoding ascii results.txt $_ }
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '```'; cat results.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: w1803l-${{ matrix.ref }}
          path: |
            results.txt
            admin.log
            normal.log
