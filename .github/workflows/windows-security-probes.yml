name: windows-security-probes

# win-1648 D324 probes only (probe branch, not for main).
on:
  workflow_dispatch:

jobs:
  probes:
    name: win-1648 D324 probes (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build the elevated sandbox helpers
        shell: bash
        run: cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
      - name: D324 elevated
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CODEX_SEC_WIN_341_REQUIRE: "1"
        run: |
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          failed=0
          for t in $(cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --list --format terse sec_win_1648_ | sed -n 's/: test$//p'); do
            cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --exact "$t" --include-ignored --nocapture --test-threads=1 || failed=$((failed+1))
          done
          test "$failed" = 0
      - name: D324 normal session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib --no-run --message-format=json
          $sandbox = ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          $bin = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $env:CARGO_BIN_EXE_codex_windows_sandbox_setup = Join-Path $bin 'codex-windows-sandbox-setup.exe'
          $env:CARGO_BIN_EXE_codex_command_runner = Join-Path $bin 'codex-command-runner.exe'
          $env:CODEX_PF27S06_SETUP_SEED = Join-Path $env:RUNNER_TEMP 'd324-seed'
          New-Item -ItemType Directory -Force $env:CODEX_PF27S06_SETUP_SEED | Out-Null
          $tests = @(& $sandbox --list --format terse 'sec_win_1648_' | Where-Object { $_ -like '*: test' } | ForEach-Object { $_ -replace ': test$', '' })
          $failed = 0
          foreach ($t in $tests) {
            # Record a fresh setup elevated, then reuse it at medium integrity.
            & $sandbox --exact 'unified_exec::tests::command_identity::elevated::sec_win_1648_elevated_command_keeps_write_access_to_its_own_processes' --nocapture --test-threads=1 | Out-Null
            $env:CODEX_SEC_WIN_1648_REQUIRE = '1'
            & $medium -Program $sandbox -Arguments @('--exact', $t, '--include-ignored', '--nocapture', '--test-threads=1')
            if ($LASTEXITCODE -ne 0) { $failed++ }
            Remove-Item Env:CODEX_SEC_WIN_1648_REQUIRE
          }
          if ($failed -ne 0) { throw "$failed D324 tests failed in a normal session" }
