name: rust-ci Windows native tests

# Native Windows Bazel tests for the crates whose Windows-only failures kept
# breaking nightly (#636, owner decision 2026-10-15): codex-tui, codex-core,
# codex-state and codex-login. rust-ci.yml runs this on pull requests that
# change one of those crates; nightly-ci.yml still runs every crate's native
# Windows tests (bazel.yml, test-windows-native-main).
#
# Same Bazel setup as test-windows-native-main, limited to those crates' test
# targets. Restore-only: it reads the repository cache nightly saves on main
# and saves nothing (#771, #815). With no build cache it compiles cold: about
# 43 minutes on windows-2022 (probe run 38684269814).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Bazel test (tui, core, state, login)
    runs-on: windows-2022
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The cache scope of bazel.yml's test-windows-native-main, so this
      # restores the repository cache the nightly run saves on main.
      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-test-windows-native-main

      - name: Prepare named test evidence
        id: named_evidence
        continue-on-error: true
        shell: bash
        run: |
          # A new private directory prevents reuse of an earlier invocation.
          # Only the collector's allowlisted JSON is uploaded below.
          evidence_dir="$(mktemp -d "${RUNNER_TEMP}/bazel-named-results.XXXXXXXX")"
          evidence_dir="$(cygpath -m "$evidence_dir")"
          invocation_id="$(python -c 'import uuid; print(uuid.uuid4())')"
          checkout_sha="$(git rev-parse HEAD)"
          echo "directory=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "invocation_id=$invocation_id" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"

      - name: bazel test tui, core, state, login
        id: native_tests
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          NAMED_EVIDENCE_DIR: ${{ steps.named_evidence.outputs.directory }}
          NAMED_EVIDENCE_INVOCATION: ${{ steps.named_evidence.outputs.invocation_id }}
        shell: bash
        run: |
          bazel_targets=(
            //codex-rs/tui/...
            //codex-rs/core/...
            //codex-rs/state/...
            //codex-rs/login/...
          )

          # --build_tests_only: skip the crates' binaries and libraries that
          # no test needs. The Windows skip list comes from .bazelrc's
          # windows-native-tests config, as in the nightly job.
          bazel_test_args=(
            test
            --build_tests_only
            # #691: the intermittent login test gets one automatic re-run
            # (Bazel re-runs the whole target and reports it FLAKY). Owner
            # decision 2026-10-15; if it fails both attempts again, add it to
            # .bazelrc's windows-native-tests skip list.
            --flaky_test_attempts=//codex-rs/login:login-unit-tests@2
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            "--build_metadata=COMMIT_SHA=${GITHUB_SHA}"
            --build_metadata=TAG_windows_native_pr=true
          )

          # Capture failure must not prevent the existing tests from running.
          evidence_args=()
          if [[ -n "$NAMED_EVIDENCE_DIR" && -n "$NAMED_EVIDENCE_INVOCATION" ]]; then
            bazel_test_args+=(
              "--build_event_json_file=${NAMED_EVIDENCE_DIR}/events.json"
              "--invocation_id=${NAMED_EVIDENCE_INVOCATION}"
            )
            evidence_args+=(--test-results-root-file "$NAMED_EVIDENCE_DIR/testlogs-root.txt")
          fi

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            "${evidence_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Collect named test evidence
        if: always() && !cancelled() && steps.named_evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          NAMED_EVIDENCE_DIR: ${{ steps.named_evidence.outputs.directory }}
          NAMED_EVIDENCE_INVOCATION: ${{ steps.named_evidence.outputs.invocation_id }}
          NAMED_EVIDENCE_CHECKOUT: ${{ steps.named_evidence.outputs.checkout_sha }}
          NATIVE_TEST_OUTCOME: ${{ steps.native_tests.outcome }}
        run: |
          python .github/scripts/collect_bazel_test_results.py \
            --bep "$NAMED_EVIDENCE_DIR/events.json" \
            --testlogs-root-file "$NAMED_EVIDENCE_DIR/testlogs-root.txt" \
            --invocation-id "$NAMED_EVIDENCE_INVOCATION" \
            --checkout-sha "$NAMED_EVIDENCE_CHECKOUT" \
            --workflow-outcome "$NATIVE_TEST_OUTCOME" \
            --output "$NAMED_EVIDENCE_DIR/report.json"

      - name: Upload named test evidence
        if: always() && !cancelled() && steps.named_evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-named-results-test-windows-native-pr
          path: ${{ steps.named_evidence.outputs.directory }}/report.json
          if-no-files-found: warn

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-pr
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
