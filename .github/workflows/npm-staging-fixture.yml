name: npm-staging-fixture

# repo-checks stages the npm package from the native artifacts of one pinned
# upstream rust-release run (.github/npm-staging-fixture.json). Those artifacts
# expire, and an expired pin breaks staging on every packaging PR and main run
# (#2514, #2515). Weekly, the `check` job verifies the pin. When a target is
# missing or expires within 21 days, it picks the newest successful
# rust-release run that has all six targets (searching at most 20 runs) and
# uploads the candidate pin plus a verification summary as the
# `npm-staging-fixture-candidate` artifact. The `report` job then opens, or
# updates, one bot-owned tracking issue with the proposed pin, run, tag, head
# SHA, earliest expiry and workflow-run link. A maintainer applies it in a
# normal PR, which runs full npm staging because the pin is a packaging input.
# This workflow never opens PRs: the repository setting "Allow GitHub Actions
# to create and approve pull requests" stays disabled. A healthy pin opens no
# issue. If no valid run is found, the `check` job fails and the pin stays.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-staging-fixture
  cancel-in-progress: false

jobs:
  check:
    name: Check the npm staging fixture
    if: github.repository == 'CorbanuCore/CorbanuTerminal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fixture.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify the pin, or find the newest valid rust-release run
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/npm_staging_fixture.py refresh
          --output "${RUNNER_TEMP}/npm-staging-fixture/npm-staging-fixture.json"
          --summary-file "${RUNNER_TEMP}/npm-staging-fixture/summary.md"

      - name: Upload the candidate pin and verification summary
        if: steps.fixture.outputs.changed == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-staging-fixture-candidate
          path: ${{ runner.temp }}/npm-staging-fixture/
          if-no-files-found: error

  report:
    name: Open or update the refresh tracking issue
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-staging-fixture-candidate
          path: ${{ runner.temp }}/npm-staging-fixture

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/npm_staging_fixture.py report
          --repo "$REPO" --run-url "$RUN_URL"
          --summary-file "${RUNNER_TEMP}/npm-staging-fixture/summary.md"
