name: npm-staging-fixture

# repo-checks stages the npm package from the native artifacts of one pinned
# upstream rust-release run (.github/npm-staging-fixture.json). Those artifacts
# expire, and an expired pin breaks staging on every packaging PR and main run
# (#2514, #2515). Weekly, this job checks the pin and, when a required target
# is missing or expires within 21 days, moves it to the newest successful
# rust-release run that has all six targets (searching at most 20 runs) and
# opens a PR. The PR changes a packaging input, so repo-checks runs full
# staging on it. PRs opened with the workflow token don't start other
# workflows: close and reopen the PR (or push to it) to run CI. The job fails
# if no valid run is found, leaving the pin as it was.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-staging-fixture
  cancel-in-progress: false

jobs:
  refresh:
    name: Check and refresh the npm staging fixture
    if: github.repository == 'CorbanuCore/CorbanuTerminal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify the pin, or move it to the newest valid rust-release run
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/npm_staging_fixture.py refresh --summary-file "${RUNNER_TEMP}/npm-staging-fixture.md"

      - name: Open pull request
        if: steps.fixture.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: .github/npm-staging-fixture.json
          commit-message: "ci: move the npm staging fixture to rust-release run ${{ steps.fixture.outputs.run_id }}"
          title: "ci: move the npm staging fixture to ${{ steps.fixture.outputs.tag }} (#2515)"
          body-path: ${{ runner.temp }}/npm-staging-fixture.md
          branch: bot/npm-staging-fixture
          delete-branch: true
