name: astra-1909 regression proof
on:
  push:
    branches: [astra-1909-fail-before]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.111
      - name: Focused native regressions through isolated wrapper
        shell: pwsh
        run: |
          Remove-Item Env:CORBANU_HOME,Env:CODEX_HOME,Env:PFTERMINAL_HOME -ErrorAction SilentlyContinue
          python scripts/isolated_rust_tests.py -p codex-windows-sandbox --lib --locked -j 8 -E 'test(file_print_flags_growth_during_the_read) | test(legacy_spawn_cancelled_while_starting_closes_its_handles) | test(direct_retag_without_the_privilege)'
          if ($LASTEXITCODE -eq 0) { throw 'Expected fail-before regressions' }
      - name: Privilege refusal pass-after
        shell: pwsh
        run: |
          python -c 'from pathlib import Path; p=Path("codex-rs/windows-sandbox-rs/src/git_watch_tests.rs"); s=p.read_text(); old="                        panic!(\"retag failed: {err}\");"; assert s.count(old)==1; p.write_text(s.replace(old,"                        retagged.set(Some(false));"))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:CORBANU_HOME,Env:CODEX_HOME,Env:PFTERMINAL_HOME -ErrorAction SilentlyContinue
          python scripts/isolated_rust_tests.py -p codex-windows-sandbox --lib --locked -j 8 -E 'test(direct_retag_without_the_privilege)'
          exit $LASTEXITCODE
