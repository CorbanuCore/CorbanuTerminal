name: security-ingress-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/security-ingress-contract.yml"
      - "BUILD.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/content-security/**"
      - "qa/security-levels/ingress-contract/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-ingress-contract.yml"
      - "BUILD.bazel"
      - "MODULE.bazel.lock"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/content-security/**"
      - "qa/security-levels/ingress-contract/**"

permissions:
  contents: read

jobs:
  verify:
    name: Ingress contract / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Verify immutable fixtures and regression harness
        shell: bash
        run: |
          set -euo pipefail
          fixture="qa/security-levels/ingress-contract/fixtures/benign-v1/raw.txt"
          attributes="$(git check-attr text eol -- "$fixture")"
          printf '%s\n' "$attributes"
          grep -F "$fixture: text: unset" <<<"$attributes"
          python qa/security-levels/ingress-contract/verify.py
          python qa/security-levels/ingress-contract/test_verify.py
      - name: Test registered Rust contract
        shell: bash
        working-directory: codex-rs
        run: cargo test -p codex-content-security
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
