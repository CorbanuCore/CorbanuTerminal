name: tmux smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmux-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tmux-smoke:
    name: Ubuntu tmux smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      CORBANU_TMUX_ARTIFACT_DIR: ${{ github.workspace }}/tmux-artifacts
      CORBANU_TMUX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Install tmux prerequisites
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            pkg-config \
            tmux
          tmux -V
      - name: Run focused tmux tests
        run: |
          started=$SECONDS
          just test -p codex-tui --test all tmux --retries 0
          echo "tmux smoke runtime: $((SECONDS - started))s"
      - name: Upload tmux failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tmux-smoke-${{ github.sha }}
          path: tmux-artifacts/
          if-no-files-found: warn
