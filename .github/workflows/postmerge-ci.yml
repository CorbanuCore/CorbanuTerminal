name: postmerge-ci

# This is the single entrypoint for main-only CI that is intentionally outside
# the merge-blocking suite. It keeps the broader postmerge signal in one run.
on:
  push:
    branches: [main]

jobs:
  # Keep reusable workflow calls alphabetized. Each child retains its own
  # workflow_dispatch trigger so maintainers can rerun flaky suites directly.
  rust-ci-full:
    name: rust-ci-full
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  v8-canary:
    name: v8-canary
    uses: ./.github/workflows/v8-canary.yml
    # A called workflow cannot request more token scope than its caller. The
    # repository default token is read-only (no `actions`), and v8-canary's
    # build job asks for `actions: read`, so grant it here or the whole run
    # fails at startup.
    permissions:
      contents: read
      actions: read
    secrets: inherit

  results:
    name: Postmerge CI results
    needs:
      - rust-ci-full
      - v8-canary
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Postmerge runs use the pushed main commit, so this helper always comes
      # from the same revision that defined the parent workflow.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

  # PR checks do not run this workflow, so a red main went unnoticed for 40
  # runs. Keep one open issue while main is red (a comment per failed run,
  # which notifies its subscribers) and close it on the next green run.
  # Cancelled (superseded) runs change nothing.
  report:
    name: Report main status
    needs: results
    if: ${{ always() && (needs.results.result == 'failure' || needs.results.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open, update or close the red-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.results.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="postmerge-ci is failing on main"
          number="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ "${RESULT}" == "failure" ]]; then
            body="postmerge-ci failed on ${SHA::10}: ${RUN_URL}"
            if [[ -n "${number}" ]]; then
              gh issue comment "${number}" --body "${body}"
            else
              note="PR checks do not run postmerge-ci (full Linux tests, musl and Windows clippy). This issue closes itself on the next green run."
              gh issue create --title "${title}" --body "${body}"$'\n\n'"${note}"
            fi
          elif [[ -n "${number}" ]]; then
            gh issue close "${number}" --comment "postmerge-ci is green again on ${SHA::10}: ${RUN_URL}"
          fi
