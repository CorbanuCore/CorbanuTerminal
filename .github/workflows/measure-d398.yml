name: measure-d398

# D398 (#1766) MEASUREMENT ONLY: never merged. The same two probes on the
# fail-before branch (the fix reverted) and on the fix, in an elevated and a
# normal (medium-integrity) session.
on:
  push:
    branches: [win-398-failbefore, win-398-after]

permissions:
  contents: read

jobs:
  measure:
    name: measure D398 (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Build the probes
        shell: bash
        run: |
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-core --lib --no-run
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-sandboxing --lib --no-run
      - name: Elevated session
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CORBANU_TEST_REQUIRE_SYMLINKS: "1"
          CORBANU_TEST_REQUIRE_SUBST: "1"
          CORBANU_TEST_REQUIRE_MAPPED_DRIVE: "1"
          CORBANU_TEST_REQUIRE_8DOT3: "1"
        run: |
          fsutil 8dot3name set C: 0
          core=0
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-core --lib -- sec_win_d398 --nocapture --test-threads=1 2>&1 | tee core.log || core=$?
          sandboxing=0
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-sandboxing --lib -- sec_win_d398 --nocapture --test-threads=1 2>&1 | tee sandboxing.log || sandboxing=$?
          echo "elevated: core=$core sandboxing=$sandboxing"
          test "$core" = 0 && test "$sandboxing" = 0
      - name: Normal (medium-integrity) session
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $medium = '.github/scripts/run-at-medium-integrity.ps1'
          # A temp folder secured like a user's own (as windows-security-probes does, #1752).
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $temp = Join-Path $env:RUNNER_TEMP 'medium-temp'
          New-Item -ItemType Directory $temp -ErrorAction Stop | Out-Null
          icacls $temp /setowner "*$user" /Q | Out-Null
          $full = [Security.AccessControl.FileSystemRights]::FullControl
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $dacl = New-Object Security.AccessControl.DirectorySecurity
          $dacl.SetAccessRuleProtection($true, $false)
          foreach ($s in @($user, 'S-1-5-18', 'S-1-5-32-544')) {
            $dacl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
              (New-Object Security.Principal.SecurityIdentifier($s)), $full, $inherit, 'None', 'Allow')))
          }
          [IO.Directory]::SetAccessControl($temp, $dacl)
          $env:TEMP = $temp
          $env:TMP = $temp
          $ErrorActionPreference = 'Continue'
          function Get-TestExe([string[]]$CargoArgs) {
            $artifacts = cargo test --locked --manifest-path codex-rs/Cargo.toml @CargoArgs --no-run --message-format=json
            ($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable } | Select-Object -Last 1).executable
          }
          $whoami = & $medium -Program "$env:SystemRoot\System32\whoami.exe" -Arguments @('/groups')
          if (-not ($whoami -match 'Medium Mandatory Level')) { throw "the normal-session token is not medium integrity" }
          New-SmbShare -Name d398 -Path $temp -FullAccess 'Everyone' -ErrorAction Stop | Out-Null
          $env:CODEX_TEST_D398_SHARE = '\\localhost\d398'
          $env:CODEX_TEST_D398_SHARE_DIR = $temp
          $env:CORBANU_TEST_REQUIRE_8DOT3 = '1'
          $core = Get-TestExe @('-p', 'codex-core', '--lib')
          & $medium -Program $core -Arguments @('sec_win_d398', '--nocapture', '--test-threads=1')
          $coreCode = $LASTEXITCODE
          $sandboxing = Get-TestExe @('-p', 'codex-sandboxing', '--lib')
          & $medium -Program $sandboxing -Arguments @('sec_win_d398', '--nocapture', '--test-threads=1')
          $sandboxingCode = $LASTEXITCODE
          Remove-SmbShare -Name d398 -Force
          "normal session: core=$coreCode sandboxing=$sandboxingCode"
          if ($coreCode -ne 0 -or $sandboxingCode -ne 0) { exit 1 }
