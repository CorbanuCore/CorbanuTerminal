name: measure-1766

# #1766 MEASUREMENT ONLY: never merged; re-run on main 7a8c29fb67 by docs-1108 (D398 check).
on:
  push:
    branches: [docs-1108-1766-recheck]

permissions:
  contents: read

jobs:
  measure:
    name: measure #1766 (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Measure non-canonical cwd refusals (elevated runner)
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-sandboxing --lib -- --ignored --exact windows::measure_1766::measure_1766_non_canonical_cwd --nocapture --test-threads=1
