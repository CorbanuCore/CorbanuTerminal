name: measure-1766

# #1766 MEASUREMENT ONLY: never merged; runs only on this branch.
on:
  push:
    branches: [win-1766-measure]

permissions:
  contents: read

jobs:
  measure:
    name: measure #1766 (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Measure non-canonical cwd refusals (elevated runner)
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-sandboxing --lib -- --ignored --exact windows::measure_1766::measure_1766_non_canonical_cwd --nocapture --test-threads=1
      - name: Build the elevated sandbox helpers
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo build --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --bins
      - name: Runtime check, read-only folder by real path under a linked cwd
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="${CARGO_TARGET_DIR}/debug"
          export CARGO_BIN_EXE_codex_windows_sandbox_setup="$(cygpath -w "${bin_dir}/codex-windows-sandbox-setup.exe")"
          export CARGO_BIN_EXE_codex_command_runner="$(cygpath -w "${bin_dir}/codex-command-runner.exe")"
          cargo test --locked --manifest-path codex-rs/Cargo.toml -p codex-windows-sandbox --lib -- --ignored measure_1766 --nocapture --test-threads=1
