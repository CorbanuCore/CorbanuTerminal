site_name: Corbanu Terminal
site_description: Crypto-native AI services terminal based on the open-source Codex CLI.
site_url:
  !ENV [
    CORBANU_DOCS_SITE_URL,
    PFTERMINAL_DOCS_SITE_URL,
    "http://127.0.0.1:8088/terminal/",
  ]
repo_url: https://github.com/CorbanuCore/CorbanuTerminal
repo_name: CorbanuCore/CorbanuTerminal
docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  sprints/archive/

theme:
  name: material
  language: en
  logo: assets/images/post-fiat-mark.svg
  favicon: assets/images/favicon.png
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Corbanu Product Specification: corbanu-product-spec.md
  - Start Here:
      - Install: install.md
      - Getting Started: getting-started.md
      - Authentication: authentication.md
      - Configuration: config.md
      - Example Config: example-config.md
      - Slash Commands: slash_commands.md
  - Features:
      - Feature Catalog: features/index.md
      - "/providers, Account Login, and /model": features/model-providers.md
      - "/vault Credentials": features/vault.md
      - "/wallet and Corbanu Plan": features/wallet-plan.md
      - "/gpu Rentals": features/gpu-rentals.md
      - "/panes and Workspaces": features/workspaces.md
      - "/spawn Hierarchy": features/spawn-orchestration.md
      - "/orchestrate Supervision": features/orchestrate.md
      - "/tasknode and Identity": features/tasknode.md
      - "/telegram Remote Control": features/telegram.md
      - "Goals, Memories, Side Work, and Docs": features/context-tools.md
      - Runtime and Extensions: features/runtime-extensions.md
      - Detailed References:
          - Claude Headless Panes: features/claude-headless-panes.md
          - Subagents: features/subagents.md
  - Benchmarking:
      - Overview: benchmarking/index.md
      - Website Builder: benchmarking/website-builder.md
      - Coding Tests: benchmarking/coding-tests.md
  - Orchestration:
      - Overview: orchestration/index.md
      - Nazgul: orchestration/nazgul.md
      - Troll: orchestration/troll.md
      - Orc: orchestration/orc.md
  - Integrations:
      - Overview: integrations/index.md
      - Ambient: integrations/ambient.md
      - Z.AI GLM 5.2: integrations/zai-glm-52.md
      - OpenRouter: integrations/openrouter.md
      - Baseten: integrations/baseten.md
      - Vercel: integrations/vercel.md
      - Codex Fork: integrations/codex-fork.md
  - Runtime:
      - Exec: exec.md
      - Exec Policy: execpolicy.md
      - Sandbox: sandbox.md
      - Skills: skills.md
      - AGENTS.md: agents_md.md
  - Project:
      - Sprints:
          - Workflow: sprints/index.md
          - Current Autoreview Work:
              - Overview: sprints/current/arbitrary-model-autoreview/index.md
              - "PF-14 — Arbitrary-model Autoreview":
                  - "PF-14-S01 — Explicit request and skill contract": sprints/current/arbitrary-model-autoreview/pf-14-s01-request-and-skill-contract.md
                  - "PF-14-S02 — Review packet and secret gate": sprints/current/arbitrary-model-autoreview/pf-14-s02-review-packet-and-secret-gate.md
                  - "PF-14-S03 — Shared Core provider readiness": sprints/current/arbitrary-model-autoreview/pf-14-s03-core-provider-readiness.md
                  - "PF-14-S04 — Deterministic exact-runtime dispatch": sprints/current/arbitrary-model-autoreview/pf-14-s04-exact-runtime-dispatch.md
                  - "PF-14-S05 — Fail-closed full-history invariant": sprints/current/arbitrary-model-autoreview/pf-14-s05-full-history-invariant.md
                  - "PF-14-S06 — Isolated bounded review runner": sprints/current/arbitrary-model-autoreview/pf-14-s06-isolated-review-runner.md
                  - "PF-14-S07 — TUI qualification and finished documentation": sprints/current/arbitrary-model-autoreview/pf-14-s07-tui-qualification-and-docs.md
          - Current Security Work:
              - Overview: sprints/current/p0-security-levels/index.md
              - "PF-13-S01 — Vault-backed exact-host credential substitution": sprints/current/p0-security-levels/pf-13-s01-vault-backed-exact-host-credential-substitution.md
          - Sprint Template: sprints/SPRINT_TEMPLATE.md
      - Plans:
          - Plan Process: plans/index.md
          - Active Plans: plans/active/index.md
          - P0 Security Levels: plans/active/p0-security-levels.md
          - Proposed Plans:
              - Overview: plans/proposed/index.md
              - Arbitrary-model Autoreview: plans/proposed/arbitrary-model-autoreview.md
              - Prompt-Injection Firewall: plans/proposed/prompt-injection-firewall.md
          - Completed Plans: plans/completed/index.md
          - Cancelled Plans: plans/cancelled/index.md
          - Plan Template: plans/PLAN_TEMPLATE.md
      - Corbanu Terminal Development Skill: corbanu-terminal-development-skill.md
      - Contributing: contributing.md
      - CI Coverage: ci.md
      - License: license.md

plugins:
  - search
