site_name: Corbanu Terminal
site_description: Crypto-native AI services terminal based on the open-source Codex CLI.
site_url:
  !ENV [
    CORBANU_DOCS_SITE_URL,
    PFTERMINAL_DOCS_SITE_URL,
    "http://127.0.0.1:8088/terminal/",
  ]
repo_url: https://github.com/CorbanuCore/CorbanuTerminal
repo_name: CorbanuCore/CorbanuTerminal
docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  sprints/archive/

theme:
  name: material
  language: en
  logo: assets/images/post-fiat-mark.svg
  favicon: assets/images/favicon.png
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Corbanu Product Specification: corbanu-product-spec.md
  - Start Here:
      - Install: install.md
      - Getting Started: getting-started.md
      - Authentication: authentication.md
      - Configuration: config.md
      - Example Config: example-config.md
      - Slash Commands: slash_commands.md
  - Features:
