[package]
name = "codex-secret-broker-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "codex-secret-broker-service"
path = "src/main.rs"

[[bin]]
name = "codex-secret-broker-service-fixture"
path = "src/fixture/main.rs"
required-features = ["synthetic-fixture"]

[features]
synthetic-fixture = ["dep:tempfile", "dep:codex-keyring-store", "dep:codex-utils-absolute-path"]

[lints]
workspace = true

[dependencies]
codex-secret-broker = { workspace = true }
codex-security-audit = { workspace = true }
codex-security-policy = { workspace = true }
codex-vault = { workspace = true }
codex-keyring-store = { workspace = true, optional = true }
codex-utils-absolute-path = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["socket", "user", "poll"] }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }

