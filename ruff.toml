# Corbanu's qa/ evidence and benchmarks/ trees are hash-pinned (manifests, provenance
# records, CI contracts), not editable sources. Preserve historical hashes; never
# regenerate them to satisfy formatting.
# Keep this boundary aligned with is_frozen_artifact in scripts/format.py.
extend-exclude = [
    "sdk/python",
    "codex-rs/vendor",
    "qa/**",
    "benchmarks/**",
]
