# PF-29-S01. Record with
#   PF29_CANDIDATE=<corbanu> --bin qa/security-levels/sprints/PF-29-S01/demos/restart-once.sh
id = "pf29s01-isolated-after-restart"
feature = "Preflight passes and Aggressive isolates the SSH private key after restart"
expected = "The review shows a passed preflight that will deny ~/.ssh; after a real restart /status claims the checked boundary and the agent's probe is denied the private and public key but still reads an ordinary home file."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"seed.sh" = '''
mkdir -p "$HOME/.ssh" && printf 'synthetic demo key pf29\n' > "$HOME/.ssh/id_ed25519" && printf 'ssh-ed25519 AAAAsyntheticpublic pf29\n' > "$HOME/.ssh/id_ed25519.pub" && echo seeded fake ssh key pair
'''
"probe.sh" = '''
probe() { if eval "$2" >/dev/null 2>&1; then echo "$1: ALLOWED"; else echo "$1: denied"; fi; }
probe "read ~/.ssh/id_ed25519 (private key)" 'cat "$HOME/.ssh/id_ed25519"'
probe "read ~/.ssh/id_ed25519.pub (public key)" 'cat "$HOME/.ssh/id_ed25519.pub"'
echo probes done
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
type = "!sh seed.sh"

[[steps]]
key = "Enter"

[[steps]]
wait = "seeded fake ssh key pair"

[[steps]]
type = "/security"

[[steps]]
key = "Enter"

[[steps]]
wait = "Active in this session: Permissive"

[[steps]]
key = "Up"

[[steps]]
key = "Enter"

[[steps]]
wait = "Switch to Aggressive\\?"

[[steps]]
key = "Down"
repeat = 20

[[steps]]
wait = "Credential files denied to agent commands after restart: ~/.ssh, ~/.ssh/id_ed25519"

[[steps]]
wait = "Preflight passed"

[[steps]]
pause = 4.0

[[steps]]
key = "Enter"

[[steps]]
wait = "Saved: Aggressive"

[[steps]]
pause = 1.0

[[steps]]
key = "Enter"

[[steps]]
type = "/exit"

[[steps]]
key = "Enter"

[[steps]]
wait = "restarting Corbanu Terminal.*model: +glm-5\\.2"
timeout = 60

[[steps]]
pause = 1.0

[[steps]]
type = "/status"

[[steps]]
key = "Enter"

[[steps]]
wait = "protected boundary checked at launch"

[[steps]]
pause = 3.0

[[steps]]
type = "Run sh probe.sh once and show me its raw output, then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "Would you like to run the following command"
timeout = 180
compress = 3

[[steps]]
key = "Enter"

[[steps]]
wait = "ordinary file\\): (denied|ALLOWED)[\\s\\S]*probes done[\\s\\S]*probes done"
timeout = 180
compress = 3

[[steps]]
pause = 4.0
