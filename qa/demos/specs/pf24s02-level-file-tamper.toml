# PF-24-S02: a level file rewritten to Permissive outside /security, while Core's confirmed level is Aggressive, is caught and Aggressive stays enforced. No model turn (Z.AI balance was empty when recorded).
id = "pf24s02-level-file-tamper"
feature = "Level file changed outside /security is caught"
expected = "After Aggressive is confirmed, security_level.toml is overwritten with Permissive by a shell command; /security reports the stored level as changed outside /security and says Aggressive is enforced."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
key = "Escape"
[[steps]]
pause = 1.0
[[steps]]
type = "!printf 'version = 1\\nlevel = \"permissive\"\\n' > {home}/security_level.toml && echo rewritten"
[[steps]]
key = "Enter"
[[steps]]
wait = "rewritten"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "changed outside /security"
[[steps]]
pause = 4.0
