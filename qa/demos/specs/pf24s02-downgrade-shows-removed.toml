# PF-24-S02: returning to Permissive shows the protections that go first; Esc changes nothing; confirming keeps this session Aggressive until restart. No model turn (Z.AI balance was empty when recorded).
id = "pf24s02-downgrade-shows-removed"
feature = "Downgrade shows removed protections first"
expected = "Under Aggressive, choosing Permissive lists every protection removed at the next start; Esc leaves both records as they were; Enter saves Permissive and Core's level stays Aggressive in this session, Permissive from the next start."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
key = "Enter"
[[steps]]
wait = "r restart now"
[[steps]]
key = "r"
[[steps]]
wait = "Corbanu Terminal \\(v"
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Aggressive"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Protections removed at the next start"
[[steps]]
pause = 4.0
[[steps]]
key = "Escape"
[[steps]]
wait = "Cancelled\\. Nothing changed\\."
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Return to Permissive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Core's level stays Aggressive in this session and is Permissive from the next start"
[[steps]]
pause = 4.0
